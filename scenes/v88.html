// 88. 47 Tabs Open (v3 original, no voice) — SHOCK OPEN: a browser window floats over his head (his brain) and tabs keep spawning

const OT = 3, GOLDS = [12, 27, 40], N = LABELS.length;
const idx = (s) => LABELS.indexOf(s);
