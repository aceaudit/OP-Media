<script>
const PH = [

];

// 71. The Hard Years — "The age of 16 … 23 isn't easy…" Ages tick on a staircase, then the road of hard lessons, then the 8 years light up gold.
initCanvas('c');
const DUR = 17.8;
ATMO = { tint: [255, 170, 110], tintA: 0.06, shafts: 0.07, bokeh: 0.9 }; CAP.y = 430;

CAP.end = 16.75;
const AGES = [0.56, 1.04, 1.6, 2.0, 2.48, 2.8, 3.28, 3.92];
const FLOOR = 1400;
const SC = [[0, 5.3], [5.3, 14.35], [14.35, 99]];
// ---------------------------------------------------------------- 1: the ages staircase
const STEPX = (i) => 150 + i * 111, STEPY = (i) => 1330 - i * 50;
function scene1(t) {
  const n = AGES.filter((a) => t >= a).length;           // ages said so far
  const crack = smooth(4.8, 5.0, t);
  floorLine(FLOOR + 2, 0.18);
  // steps

  txt('YEARS OLD', 0, 150, 30, 'rgba(240,238,232,0.6)', 700, 'center', null, 8); ctx.restore();
  // figure hops up a step per age

  const i = Math.max(0, n - 1), tA = n ? AGES[n - 1] : 0, u = n > 1 ? clamp((t - tA) / 0.22) : 1;
  const a = n > 1 ? [STEPX(i - 1), STEPY(i - 1)] : [STEPX(0), STEPY(0)], b = [STEPX(i), STEPY(i)];
  let x = lerp(a[0], b[0], u), y = lerp(a[1], b[1], u) - 60 * Math.sin(Math.PI * u), P = u < 1 ? jumpPose() : standPose(Math.sin(t * 3));
  if (t >= 4.8) { const v = smooth(4.8, 5.0, t); P = mix(P, stumblePose(), v); y += 26 * v; }

}
// ---------------------------------------------------------------- 2: the road — every line happens to him
const marks = makeMarks();
const RX = 470;

function scene2(t) {

  const dist = (tt - 5.3) * 260 - (tt > fallT ? Math.min(tt, upT) - fallT : 0) * 260;

  const K = 1.35 + 0.25 * easeOutBack(clamp((t - 13.28) / 0.35)) * strong;

    rays(RX, 1100, 120, 700, 14, t, 0.16 * strong); }

    ctx.restore();

  // fail stamp
  if (t >= 8.32 && t < 8.95) { ctx.save(); ctx.globalAlpha *= 1 - smooth(8.75, 8.95, t); panel(RX + 150, 960, 170, 210, 14, 'rgba(255,255,255,0.3)', '#f4f2ee'); for (let l = 0; l < 4; l++) { ctx.fillStyle = '#b9b4aa'; ctx.fillRect(RX + 175, 1060 + l * 24, 110, 6); } txt('F', RX + 235, 1012, 84, RED, 700); ctx.restore(); stamp('FAILED', RX + 230, 1200, t, 8.32, RED, 50, -0.12, true, 8.95); }
  // the figure
  setFigureScale(K);
  let P;
  if (t < fallT) P = walkPose((t - 5.3) * 6.3, 0.05);
  else if (t < fallT + 0.2) P = mix(walkPose((fallT - 5.3) * 6.3, 0.05), stumblePose(), (t - fallT) / 0.2);
  else if (t < upT - 0.3) P = mix(stumblePose(), pronePose(), smooth(fallT + 0.2, fallT + 0.35, t));
  else if (t < upT) P = mix(pronePose(), kneelPose(), (t - (upT - 0.3)) / 0.3);
  else if (t < upT + 0.2) P = mix(kneelPose(), walkPose((t - 5.3) * 6.3, 0.05), (t - upT) / 0.2);
  else if (t < 10.3) P = walkPose((t - 5.3) * 6.3, 0.05);
  else if (t < 13.28) P = { ...walkPose((t - 5.3) * 5.2, 0.28), h: 0.4 };   // hunched under the storm
  else { P = cheerPose(Math.sin(t * 6)); }
  if (t >= 13.28 && t < 13.5) P = mix({ ...walkPose((t - 5.3) * 5.2, 0.28), h: 0.4 }, cheerPose(0), (t - 13.28) / 0.22);
  const J = solve(P, RX, FLOOR, 0);
  ctx.save();
  const ev = t < 6.08 ? 'neutral' : t < 6.8 ? 'sad' : t < 7.6 ? 'shock' : t < 8.3 ? 'shock' : t < 8.9 ? 'cry' : t < 10.1 ? 'shock' : t < 11.7 ? 'angry' : t < 13.28 ? 'tired' : 'joy';
  const evx = t >= 9.3 && t < 10.1 ? exprMix('shock', 'happy', 0.4) : ev;
  if (lose > 0) { ctx.globalAlpha *= 1 - 0.7 * lose * (0.85 + 0.15 * Math.sin(t * 40)); hero(J, { expr: 'tired', t, col: GREYC, blur: 6 }); }
  else hero(J, { expr: t >= 13.28 && t < 13.6 ? 'determined' : evx, t, speed: t < 13.28 ? 0.6 : 0.4, blur: 20 + 30 * strong });
  ctx.restore();
  if (lose > 0.05 && lose < 1) { ctx.save(); ctx.globalAlpha *= (1 - lose) * 0.7; hero(J, { expr: 'tired', t }); ctx.restore(); }
  if (lose > 0.3) { ctx.save(); ctx.globalAlpha *= lose * 0.5; ctx.setLineDash([12, 12]); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(J.head[0], J.head[1], L.head + 18, 0, TAU); ctx.stroke(); ctx.restore(); }
  // realize: lightbulb
  lightbulb(J.head[0] + 10, J.head[1] - 110, popK(t, 9.3, 0.25) * (1 - smooth(10.05, 10.3, t)), t);
  if (t >= 13.28) { burst(J.head[0], J.head[1], t, 13.28, 70, ['#ffc95e', '#fff', '#f0ae36'], 1300, 1.3, 13); ringFlash(J.pel[0], J.pel[1] - 60, t, 13.28, '255,201,94', 60, 700, 0.6, 14); }
}
// ---------------------------------------------------------------- 3: the eight years light up
function icon(i, x, y, c) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (i === 0) { ctx.beginPath(); ctx.arc(-14, -12, 8, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-14, 18); ctx.stroke(); ctx.globalAlpha *= 0.5; ctx.beginPath(); ctx.arc(16, -12, 8, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.moveTo(16, -2); ctx.lineTo(16, 18); ctx.stroke(); }
  else if (i === 1) { ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(14, 14); ctx.moveTo(14, -14); ctx.lineTo(-14, 14); ctx.stroke(); }
  else if (i === 2) { ctx.beginPath(); ctx.moveTo(-18, -16); ctx.lineTo(2, 4); ctx.lineTo(18, -2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-20, 18); ctx.lineTo(20, 18); ctx.stroke(); }
  else if (i === 3) { ctx.font = '700 40px Poppins'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('F', 0, 2); }
  else if (i === 4) { ctx.beginPath(); ctx.arc(0, -6, 13, 0, TAU); ctx.fill(); ctx.fillRect(-6, 8, 12, 9); }
  else if (i === 5) { ctx.beginPath(); ctx.arc(-8, -6, 10, 0, TAU); ctx.arc(6, -10, 12, 0, TAU); ctx.arc(14, -2, 8, 0, TAU); ctx.fill(); ctx.fillRect(-16, -4, 32, 8); for (let k = -1; k <= 1; k++) { ctx.beginPath(); ctx.moveTo(k * 10, 10); ctx.lineTo(k * 10 - 3, 20); ctx.stroke(); } }
  else if (i === 6) { ctx.setLineDash([5, 6]); ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -8, 10, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, 20); ctx.stroke(); }
  else { ctx.beginPath(); for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 8 : 20; ctx.lineTo(r * Math.cos(a), r * Math.sin(a)); } ctx.closePath(); ctx.fill(); }
  ctx.restore();
}
function scene3(t) {
  floorLine(FLOOR + 2, 0.2);
  const Y = 840;
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(110, Y); ctx.lineTo(970, Y); ctx.stroke();
  const prog = clamp((t - 15.1) / 0.85); ctx.strokeStyle = GOLDL; ctx.shadowColor = 'rgba(255,180,60,0.9)'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.moveTo(110, Y); ctx.lineTo(lerp(110, 970, prog), Y); ctx.stroke(); ctx.restore();
  for (let i = 0; i < 8; i++) {
    const x = 130 + i * 117, ts = 14.4 + i * 0.07, k = popK(t, ts, 0.22), litT = 15.12 + i * 0.11, lit = t >= litT;
    if (k <= 0) continue;

    ctx.fillStyle = lit ? GOLDL : 'rgba(30,29,34,0.97)'; ctx.strokeStyle = lit ? GOLDL : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 4; if (lit) { ctx.shadowColor = 'rgba(255,180,60,0.9)'; ctx.shadowBlur = 30; }
    ctx.beginPath(); ctx.arc(0, 0, 50, 0, TAU); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0; ctx.restore();
    icon(i, x, Y, lit ? INK : 'rgba(240,238,232,0.6)');
    txt(String(16 + i), x, Y + 90, 34, lit ? '#ffd98a' : 'rgba(240,238,232,0.45)', 700);

  if (t >= 15.3) txt('THE BEST YEARS', 540, Y - 120, 34, '#ffd98a', 700, 'center', 'rgba(255,170,50,0.6)', 8);
  // him, standing tall in front of it all
  setFigureScale(1.3);
  const P = t >= 16.16 ? cheerPose(Math.sin(t * 7)) : tallPose(Math.sin(t * 2));
  hero(solve(P, 540, FLOOR, 0), { expr: t >= 16.16 ? 'joy' : 'proud', t, blur: 22 + 20 * smooth(16.1, 16.4, t) });
  if (t >= 16.16) { burst(540, Y, t, 16.16, 80, ['#ffc95e', '#fff', '#f0ae36'], 1500, 1.4, 16); }
}
const AGES2 = [0.56, 1.04, 1.6, 2.0, 2.48, 2.8, 3.28, 3.92];
CAMK = [[0, 420, 1050, 1.42, 0.02], [0.5, 425, 1050, 1.38, 0], [1.4, 480, 1040, 1.15, 0], [4.3, 540, 1020, 1.0, 0], [4.8, 560, 1000, 1.08, 0.02], [5.3, 470, 1080, 1.2, 0],
        [11.5, 470, 1080, 1.25, 0], [12.1, 470, 1180, 2.1, 0], [13.2, 470, 1180, 2.2, 0], [13.45, 470, 1080, 1.15, 0], [14.3, 470, 1060, 1.1, 0], [14.4, 540, 1000, 1.0, 0], [17.8, 540, 980, 1.06, 0]];

PUNCHES = AGES2.map((a) => [a, 0.03, 0.1]).concat([[4.8, 0.06, 0.12], [13.28, 0.1, 0.15]]);

  if (t >= 11.84 && t < 13.28) { const a = smooth(11.84, 12.2, t) * 0.5; ctx.save(); ctx.fillStyle = `rgba(0,0,0,${a.toFixed(3)})`; ctx.fillRect(0, 0, 1080, 1920); ctx.restore(); } }
