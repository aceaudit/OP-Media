}

window.renderFrame = (t) => frame(t, (t) => runScenes(t, SC, SCENES), PH, (t) => { if (t >= 34.0) endText(t, 34.0, [['Slow is fine.', '#fff'], ['Stay in motion.', GOLDL]], 74); });
