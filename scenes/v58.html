<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Poppins'; font-weight: 500; src: url('fonts/Poppins-Medium.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 400; src: url('fonts/Poppins-Regular.ttf'); }
  @font-face { font-family: 'Poppins'; font-weight: 700; src: url('fonts/Poppins-Bold.ttf'); }
  html, body { margin: 0; padding: 0; background: #08080a; overflow: hidden; }
  #wrap { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div class="hook" id="h1" style="top:250px">How many <span class="g">squares</span><br>do you see?</div>
  <div class="hook small" id="h1b" style="top:430px">Lock in your answer.</div>
  <div class="hook" id="h2" style="top:290px">Most people say <span class="g">16</span>.</div>
  <div class="hook" id="h3" style="top:290px">But keep counting…</div>
  <div class="hook" id="h4" style="top:260px; font-size:84px">It's <span class="g">30</span>.</div>
  <div class="hook" id="m1" style="top:250px">There's always <span class="g">more</span><br>than you first see.</div>
  <div class="hook mid" id="m2" style="top:1418px"><span class="tag">That goes for you too.</span></div>
</div>
<script src="rig2d.js"></script>
<script src="v2.js"></script>
<script>
initCanvas('c');
const DUR = 15, BPM = 128, BAR = 240 / BPM, B8 = BAR / 8, B4 = BAR / 4, B16 = BAR / 16;
const GX = 180, GY = 560, GS = 720, N = 4, CS = GS / N;
const T1 = 2 * BAR, T2 = 3 * BAR, T3 = 4 * BAR, T4 = 5 * BAR, TM1 = T4 + 0.95, TM2 = 6.4 * BAR, TLOOP = DUR - 0.42;
const dust = makeDust(40);
// squares by size, in reading order
const SQ = { 1: [], 2: [], 3: [], 4: [] };
for (let s = 1; s <= 4; s++) for (let r = 0; r + s <= N; r++) for (let c = 0; c + s <= N; c++) SQ[s].push([c, r]);
const T_ONE = SQ[1].map((_, k) => T1 + k * B16), T_TWO = SQ[2].map((_, k) => T2 + k * B8), T_THREE = SQ[3].map((_, k) => T3 + k * B4);
function sqPath(c, r, s, inset = 0) { ctx.beginPath(); ctx.roundRect(GX + c * CS + inset, GY + r * CS + inset, s * CS - 2 * inset, s * CS - 2 * inset, 10); }
function countAt(times, t) { let n = 0; for (const x of times) if (t >= x) n++; return n; }
function drawGrid(t, glow) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,201,94,0.035)'; ctx.fillRect(GX, GY, GS, GS);
  ctx.strokeStyle = '#f0ae36'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.shadowColor = 'rgba(255,180,60,0.7)'; ctx.shadowBlur = 18 + 20 * glow;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(GX + i * CS, GY); ctx.lineTo(GX + i * CS, GY + GS); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(GX, GY + i * CS); ctx.lineTo(GX + GS, GY + i * CS); ctx.stroke();
  }
  ctx.restore();
}
function highlight(c, r, s, t, t0, col, fillA, keep, alpha = 1) {
  const age = t - t0; if (age < 0) return;
  const k = keep ? 1 : Math.exp(-age / 0.22);
  const sc = 1 + 0.06 * Math.exp(-age / 0.08);
  const cx = GX + (c + s / 2) * CS, cy = GY + (r + s / 2) * CS;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
  ctx.globalAlpha = alpha * (keep ? 1 : k);
  ctx.fillStyle = `rgba(${col},${fillA})`; sqPath(c, r, s, 12); ctx.fill();
  ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 10; ctx.shadowColor = `rgba(${col},0.9)`; ctx.shadowBlur = 26; sqPath(c, r, s, 12); ctx.stroke();
  ctx.restore();
}
function equation(t) {
  if (t < T1 || t >= TLOOP) return;
  const n1 = countAt(T_ONE, t), n2 = countAt(T_TWO, t), n3 = countAt(T_THREE, t), done = t >= T4;
  const parts = [{ s: String(n1), col: '#ffc95e', on: true }];
  if (t >= T2) parts.push({ s: ' + ', col: '#cfcac0' }, { s: String(n2), col: '#9fd3ff', on: true });
  if (t >= T3) parts.push({ s: ' + ', col: '#cfcac0' }, { s: String(n3), col: '#ff9c8f', on: true });
  if (done) parts.push({ s: ' + ', col: '#cfcac0' }, { s: '1', col: '#ffc95e' }, { s: ' = ', col: '#cfcac0' }, { s: '30', col: '#ffd98a', big: true });
  ctx.save(); ctx.textBaseline = 'alphabetic';
  const f = (p) => `700 ${p.big ? 96 : 66}px Poppins`;
  let W = 0; for (const p of parts) { ctx.font = f(p); W += ctx.measureText(p.s).width; }
  let x = 540 - W / 2; const y = 1380;
  for (const p of parts) {
    ctx.font = f(p); const w = ctx.measureText(p.s).width;
    ctx.save(); ctx.translate(x + w / 2, y - 22);
    if (p.big) { const k = popK(t, T4, 0.3); ctx.scale(k, k); ctx.shadowColor = 'rgba(255,180,60,0.9)'; ctx.shadowBlur = 30; }
    ctx.fillStyle = p.col; ctx.textAlign = 'center'; ctx.fillText(p.s, 0, 22); ctx.restore();
    x += w;
  }
  ctx.restore();
}
window.renderFrame = (t) => {
  background(t, dust);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const loop = t >= TLOOP;
  const [sx, sy] = shakeXY(t, T4, 16, 0.22), pk = punch(t, T4, 0.05, 0.25) * punch(t, T2, 0.015) * punch(t, T3, 0.015);
  ctx.save(); ctx.translate(540 + sx, GY + GS / 2 + sy); ctx.scale(pk, pk); ctx.translate(-540, -(GY + GS / 2));
  const glow = t >= T4 && !loop ? 0.5 + 0.5 * Math.exp(-(t - T4) / 0.6) : 0;
  drawGrid(t, glow);
  if (!loop) {
    // 1×1 fill (stays lit), dims when the 2×2 hunt starts
    const dim1 = t >= T2 ? 0.2 : 1;
    SQ[1].forEach(([c, r], k) => highlight(c, r, 1, t, T_ONE[k], '255,201,94', 0.32, true, dim1));
    SQ[2].forEach(([c, r], k) => { if (t < T3 + 0.3) highlight(c, r, 2, t, T_TWO[k], '143,200,255', 0.3, false); });
    SQ[3].forEach(([c, r], k) => { if (t < T4 + 0.3) highlight(c, r, 3, t, T_THREE[k], '255,122,110', 0.12, false); });
    if (t >= T4) { const k = 0.6 + 0.4 * Math.exp(-(t - T4) / 0.5); highlight(0, 0, 4, t, T4, '255,217,138', 0.14, true, k); }
    // stage tag
    const tag = t >= T4 ? null : t >= T3 ? ['3 × 3', '#ff9c8f'] : t >= T2 ? ['2 × 2', '#9fd3ff'] : t >= T1 ? ['1 × 1', '#ffc95e'] : null;
    const t0 = t >= T3 ? T3 : t >= T2 ? T2 : T1;
    if (tag) pill(tag[0], 540, GY - 58, t, t0, { bg: tag[1], size: 30 });
  }
  ctx.restore();
  if (!loop) { ringFlash(540, GY + GS / 2, t, T4, '255,201,94', 200, 760, 0.7, 14); burst(540, GY + GS / 2, t, T4, 46, ['#ffc95e', '#fff', '#f0ae36', '#9fd3ff'], 1300, 1.3, 58); }
  timerBar(540, 1340, 520, 0.5, T1, t);
  equation(t);
  vignette();
  flash(t, T4, 0.08, 0.18);
  pop($('h1'), 0, T1, t); pop($('h1b'), 0.5, T1, t);
  pop($('h2'), T1, T2, t); pop($('h3'), T2, T4, t); pop($('h4'), T4, TM1, t, 0.3);
  pop($('m1'), TM1, TLOOP, t); pop($('m2'), TM2, TLOOP, t);
  if (loop) { pop($('h1'), -1, 99, t); }
  return true;
};
window.__allSteps = { bpm: BPM, bar: BAR, one: T_ONE, two: T_TWO, three: T_THREE, t1: T1, t2: T2, t3: T3, t4: T4, m1: TM1, m2: TM2, loop: TLOOP, dur: DUR };
window.sceneReady = FONTS_READY();
</script>
</body>
</html>
